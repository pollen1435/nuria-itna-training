<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NURIA ITNA B2 - Dag 1: KLIMAAT (30 vragen)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #1a1a1a; }
    .container { max-width: 700px; margin: 0 auto; padding: 1.5rem 1rem; }
    .header { margin-bottom: 2rem; }
    .header h1 { font-size: 24px; font-weight: 500; margin-bottom: 0.5rem; }
    .header p { font-size: 13px; color: #666; }
    .badge { display: inline-block; background: #e3f2fd; color: #1976d2; padding: 0.25rem 0.75rem; border-radius: 12px; font-size: 11px; margin-bottom: 1rem; }
    
    .button { padding: 12px 16px; border: none; border-radius: 8px; font-weight: 500; cursor: pointer; font-size: 14px; transition: all 0.2s; }
    .button-primary { background: #1976d2; color: white; width: 100%; }
    .button-primary:hover { background: #1565c0; }
    .button-secondary { background: #f0f0f0; color: #333; border: 0.5px solid #ddd; flex: 1; }
    .button-secondary:hover { background: #e8e8e8; }
    .button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .question-card { background: white; padding: 1.5rem; border-radius: 8px; margin-bottom: 1.5rem; }
    .progress { font-size: 12px; color: #666; margin-bottom: 1rem; }
    .type-tag { display: inline-block; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 11px; font-weight: 500; margin-right: 0.5rem; background: #bbdefb; color: #0d47a1; }
    .type-tag.challenge { background: #ffccbc; color: #bf360c; }
    .itna-tag { display: inline-block; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 10px; background: #f0f0f0; color: #555; margin-left: 0.5rem; }
    
    .question-text { background: #f9f9f9; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 15px; line-height: 1.6; }
    .tooltip-word { cursor: help; border-bottom: 1px dotted #1976d2; color: #1976d2; font-weight: 500; }
    .tooltip { display: inline-block; position: relative; }
    .tooltip .tooltiptext { visibility: hidden; width: 250px; background-color: #333; color: #fff; text-align: left; border-radius: 6px; padding: 8px; position: absolute; z-index: 1; bottom: 125%; left: 50%; margin-left: -125px; font-size: 12px; opacity: 0; transition: opacity 0.3s; }
    .tooltip:hover .tooltiptext { visibility: visible; opacity: 1; }
    
    .option { margin-bottom: 10px; }
    .option input { margin-right: 8px; cursor: pointer; }
    .option label { cursor: pointer; font-size: 14px; }
    
    .pair-container { display: flex; gap: 20px; margin-bottom: 1rem; }
    .pair-column { flex: 1; }
    .pair-item { background: #f0f0f0; padding: 8px 12px; margin-bottom: 8px; border-radius: 6px; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; }
    .pair-item:hover { background: #e0e0e0; }
    .pair-item.selected { background: #bbdefb; border-color: #1976d2; }
    
    .word-order { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1rem; }
    .word-box { background: #f0f0f0; padding: 8px 12px; border-radius: 6px; cursor: move; user-select: none; border: 2px solid #ddd; }
    .word-box.placed { background: #bbdefb; border-color: #1976d2; }
    
    .result-area { background: #f9f9f9; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
    .result-area.correct { background: #e8f5e9; color: #2e7d32; border: 1px solid #4caf50; }
    .result-area.incorrect { background: #ffebee; color: #c62828; border: 1px solid #f44336; }
    .feedback-title { font-weight: 500; margin-bottom: 0.5rem; }
    .feedback-text { font-size: 13px; margin-top: 0.5rem; }
    .traduction { font-style: italic; color: #666; }
    
    .results { background: white; padding: 1.5rem; border-radius: 8px; text-align: center; margin-bottom: 1.5rem; }
    .results-score { font-size: 36px; font-weight: 500; margin-bottom: 0.5rem; }
    .results.excellent { color: #2e7d32; background: #e8f5e9; }
    .results.good { color: #f57f17; background: #fff3e0; }
    .results.weak { color: #c62828; background: #ffebee; }
    
    .reading { background: white; padding: 1.5rem; border-radius: 8px; line-height: 1.8; }
    .reading h3 { margin-bottom: 1rem; font-size: 18px; }
    .reading p { margin-bottom: 1rem; }
    .button-group { display: flex; gap: 8px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div id="vocabScreen">
      <div class="header">
        <h1>Dag 1: KLIMAAT</h1>
        <p>17 augustus — 20 woorden + 30 vragen</p>
      </div>
      <div class="badge">VOCABULAIRE À APPRENDRE</div>
      <div id="vocabList" style="margin-bottom: 1.5rem;"></div>
      <button class="button button-primary" onclick="startTest()">Start de test (30 vragen)</button>
    </div>

    <div id="testScreen" class="hidden">
      <div class="progress">Vraag <span id="qNumber">1</span>/30</div>
      <div class="question-card">
        <div style="margin-bottom: 0.75rem;">
          <span class="type-tag" id="typeTag">QCM</span>
          <span style="font-size: 11px; color: #666;">
            <span id="appChalTag">APPLICATION</span>
          </span>
        </div>
        <div class="question-text" id="questionContent"></div>
        <div id="feedbackArea"></div>
        <div class="button-group">
          <button class="button button-secondary" id="prevBtn" onclick="prevQuestion()">Vorige</button>
          <button class="button button-primary" id="nextBtn" onclick="nextQuestion()">Volgende</button>
        </div>
      </div>
    </div>

    <div id="readingScreen" class="hidden">
      <h1 style="margin-bottom: 1.5rem;">Tekst om te lezen</h1>
      <div class="reading" id="readingContent"></div>
      <button class="button button-primary" onclick="showResults()" style="margin-top: 1.5rem;">Ga naar resultaten</button>
    </div>

    <div id="resultsScreen" class="hidden">
      <h1 style="margin-bottom: 1.5rem;">Resultaten Dag 1</h1>
      <div class="results" id="resultsBox">
        <div class="results-score" id="scoreDisplay">0/30</div>
        <div style="font-size: 13px; margin-top: 0.5rem;" id="scoreText"></div>
      </div>
      <button class="button button-primary" onclick="restart()">Opnieuw beginnen</button>
    </div>
  </div>

  <script>
    const vocab = [
      { nl: 'hittegolf', fr: 'vague de chaleur', def: 'Een periode van extreem hete temperaturen.' },
      { nl: 'transitie', fr: 'transition', def: 'Het overgaan van één situatie naar een ander (bijv. van fossiele naar duurzame energie).' },
      { nl: 'fossiele brandstof', fr: 'carburant fossile', def: 'Energiebron uit oliën, kolen of gas; vervuilt het milieu.' },
      { nl: 'uitstoot', fr: 'émission', def: 'Gassen of vervuiling die in de atmosfeer vrijkomen.' },
      { nl: 'weerbaarheid', fr: 'résilience', def: 'Het vermogen om tegen klimaatverandering bestand te zijn.' },
      { nl: 'droogte', fr: 'sécheresse', def: 'Langdurige periode zonder regen, veroorzaakt waarschijnlijk door klimaatverandering.' },
      { nl: 'opwarming', fr: 'réchauffement', def: 'Stijging van de gemiddelde temperatuur op aarde.' },
      { nl: 'verschuiving', fr: 'décalage', def: 'Het verplaatsen van iets van de ene plaats naar de ander.' },
      { nl: 'opwarmen', fr: 'chauffer', def: 'Hoger worden in temperatuur; stijgen.' },
      { nl: 'overtreffen', fr: 'dépasser', def: 'Hoger gaan dan een bepaald niveau; een record breken.' },
      { nl: 'aanpassen', fr: 'adapter', def: 'Veranderingen aanbrengen om geschikt te zijn voor nieuwe omstandigheden.' },
      { nl: 'verminderen', fr: 'réduire', def: 'Omlaag brengen; minder maken.' },
      { nl: 'versnellen', fr: 'accélérer', def: 'Sneller gaan; vergroten.' },
      { nl: 'verergeren', fr: 'aggraver', def: 'Erger maken; slechter maken.' },
      { nl: 'heftig', fr: 'intense', def: 'Zeer sterk; hevig.' },
      { nl: 'extreem', fr: 'extrême', def: 'Zeer uitermate; het uiterste.' },
      { nl: 'geleidelijk', fr: 'graduellement', def: 'Stap voor stap; niet plotseling.' },
      { nl: 'dringend', fr: 'urgent', def: 'Vereist onmiddellijk aandacht; haast.' },
      { nl: 'op korte termijn', fr: 'à court terme', def: 'In de nabije toekomst; binnenkort.' },
      { nl: 'op lange termijn', fr: 'à long terme', def: 'In een verre toekomst; later.' }
    ];

    const questions = [
      // QCM (20%)
      { type: 'qcm', appChal: 'app', q: 'De <span class="tooltip"><span class="tooltip-word">hittegolf</span><span class="tooltiptext">Een periode van extreem hete temperaturen.</span></span> zorgde voor veel gezondheidsrisico\'s afgelopen zomer.', opts: ['hittegolf', 'droogte', 'transitie', 'opwarming'], ans: 'hittegolf', fr: 'vague de chaleur', passif: false, itna: 'Vocabulaire' },
      { type: 'qcm', appChal: 'app', q: 'We moeten de CO2-<span class="tooltip"><span class="tooltip-word">uitstoot</span><span class="tooltiptext">Gassen of vervuiling die in de atmosfeer vrijkomen.</span></span> verminderen.', opts: ['vermindering', 'uitstoot', 'opwarming', 'droogte'], ans: 'uitstoot', fr: 'émission', passif: false, itna: 'Vocabulaire' },
      { type: 'qcm', appChal: 'app', q: 'De energietransitie is <span class="tooltip"><span class="tooltip-word">dringend</span><span class="tooltiptext">Vereist onmiddellijk aandacht; haast.</span></span> nodig.', opts: ['heftig', 'geleidelijk', 'dringend', 'extreem'], ans: 'dringend', fr: 'urgent', passif: false, itna: 'Adjectifs' },
      { type: 'qcm', appChal: 'chal', q: 'Het klimaat <span class="tooltip"><span class="tooltip-word">warmt op</span><span class="tooltiptext">Stijgt in temperatuur.</span></span> door <span class="tooltip"><span class="tooltip-word">broeikasgassen</span><span class="tooltiptext">Gassen die de warmte van de zon vasthouden.</span></span>.', opts: ['warmt af', 'warmt op', 'verwarmt', 'wordt warm'], ans: 'warmt op', fr: 'se réchauffe', passif: false, itna: 'Verbes de base' },
      { type: 'qcm', appChal: 'chal', q: 'De <span class="tooltip"><span class="tooltip-word">weerbaarheid</span><span class="tooltiptext">Het vermogen om tegen klimaatverandering bestand te zijn.</span></span> van landen moet worden verhoogd.', opts: ['droogte', 'weerbaarheid', 'transitie', 'opwarming'], ans: 'weerbaarheid', fr: 'résilience', passif: true, itna: 'Vocabulaire + Passif' },
      { type: 'qcm', appChal: 'chal', q: 'Op <span class="tooltip"><span class="tooltip-word">lange termijn</span><span class="tooltiptext">In een verre toekomst; later.</span></span> kan de aarde onleefbaar worden.', opts: ['korte termijn', 'lange termijn', 'termijn', 'toekomst'], ans: 'lange termijn', fr: 'long terme', passif: false, itna: 'Expressions' },

      // INTRUS (20%)
      { type: 'intrus', appChal: 'app', q: 'Quel mot ne va pas dans ce groupe? <strong>hittegolf</strong> — <strong>droogte</strong> — <strong>opwarming</strong> — <strong>aanpassen</strong>', opts: ['hittegolf', 'droogte', 'opwarming', 'aanpassen'], ans: 'aanpassen', fr: 'adapter (c\'est une action, pas un phénomène climatique)', passif: false, itna: 'Catégorisation' },
      { type: 'intrus', appChal: 'app', q: 'Welk werkwoord past niet? <strong>verminderen</strong> — <strong>versnellen</strong> — <strong>verergeren</strong> — <strong>heftig</strong>', opts: ['verminderen', 'versnellen', 'verergeren', 'heftig'], ans: 'heftig', fr: 'heftig est un adjectif, pas un verbe', passif: false, itna: 'Verbes vs. Adjectifs' },
      { type: 'intrus', appChal: 'app', q: 'Quel terme n\'est pas un problème climatique? <strong>uitstoot</strong> — <strong>droogte</strong> — <strong>fossiele brandstof</strong> — <strong>transitie</strong>', opts: ['uitstoot', 'droogte', 'fossiele brandstof', 'transitie'], ans: 'transitie', fr: 'transitie est une solution, pas un problème', passif: false, itna: 'Logique' },
      { type: 'intrus', appChal: 'chal', q: 'Welk woord hoort niet bij de anderen? <strong>overtreffen</strong> — <strong>surpasser</strong> — <strong>dépasser</strong> — <strong>torenhoog</strong>', opts: ['overtreffen', 'surpasser', 'dépasser', 'torenhoog'], ans: 'torenhoog', fr: 'torenhoog est un adjectif/nom (très haut), pas une action de dépasser', passif: false, itna: 'Sémantique' },
      { type: 'intrus', appChal: 'chal', q: 'Welke vorm klopt niet? <strong>opwarmde</strong> — <strong>opgewarmd</strong> — <strong>is opgewarmd</strong> — <strong>warmt op</strong>', opts: ['opwarmde', 'opgewarmd', 'is opgewarmd', 'warmt op'], ans: 'opwarmde', fr: 'opwarmde (passé simple) n\'existe pas pour "opwarmen"; la forme correcte est "opgewarmd"', passif: false, itna: 'Participes + Temps' },
      { type: 'intrus', appChal: 'chal', q: 'Quel énoncé est incorrect? <strong>De droogte wordt erger.</strong> — <strong>De droogte verergert.</strong> — <strong>Wordt de droogte erger?</strong> — <strong>De droogte verergeren.</strong>', opts: ['De droogte wordt erger', 'De droogte verergert', 'Wordt de droogte erger?', 'De droogte verergeren'], ans: 'De droogte verergeren', fr: 'manque le verbe conjugué; devrait être "De droogte vergert" ou "De droogte zal verergeren"', passif: true, itna: 'Conjugaison' },

      // REMPLIR (20%)
      { type: 'fill', appChal: 'app', q: 'De energie____________ is urgent nodig voor de toekomst.', placeholder: 'transitie', ans: 'transitie', fr: 'transition', passif: false, itna: 'Vocabulaire' },
      { type: 'fill', appChal: 'app', q: 'We moeten emissies ____________ om het klimaat te redden.', placeholder: 'verminderen', ans: 'verminderen', fr: 'réduire', passif: false, itna: 'Verbes' },
      { type: 'fill', appChal: 'app', q: 'De temperaturen zijn ____________ door de globale opwarming.', placeholder: 'gestegen', ans: 'gestegen', fr: 'montées/augmentées', passif: false, itna: 'Participes' },
      { type: 'fill', appChal: 'chal', q: 'De ____________ van landen moet worden ____________ tegen extreme weergebeurtenissen.', placeholder: 'weerbaarheid / versterkt', ans: 'weerbaarheid / versterkt', fr: 'résilience / renforcée', passif: true, itna: 'Passif + Vocabulaire' },
      { type: 'fill', appChal: 'chal', q: 'Op korte termijn moeten ____________ maatregelen worden ____________.', placeholder: 'dringende / genomen', ans: 'dringende / genomen', fr: 'urgentes / prises', passif: true, itna: 'Passif + Adjectifs' },
      { type: 'fill', appChal: 'chal', q: 'De droogte zal ____________ als we niets doen tegen de klimaatverandering.', placeholder: 'verergeren', ans: 'verergeren', fr: 's\'aggraver', passif: false, itna: 'Futurs' },

      // APPAIRAGE (20%)
      { type: 'pairing', appChal: 'app', pairs: [['hittegolf', 'Een periode van extreem hete temperaturen'], ['droogte', 'Langdurige periode zonder regen'], ['opwarming', 'Stijging van gemiddelde temperatuur']], fr: 'Appairez les termes avec leurs définitions', passif: false, itna: 'Vocabulaire' },
      { type: 'pairing', appChal: 'app', pairs: [['verminderen', 'omlaag brengen'], ['versnellen', 'sneller gaan'], ['verergeren', 'erger maken']], fr: 'Appairez les verbes avec leurs significations', passif: false, itna: 'Verbes' },
      { type: 'pairing', appChal: 'app', pairs: [['dringend', 'très important maintenant'], ['heftig', 'très fort'], ['geleidelijk', 'petit à petit']], fr: 'Appairez les adjectifs avec leurs sens', passif: false, itna: 'Adjectifs' },
      { type: 'pairing', appChal: 'chal', pairs: [['transitie', 'passage d\'une situation à une autre'], ['weerbaarheid', 'capacité de résistance'], ['uitstoot', 'gaz émis dans l\'atmosphère']], fr: 'Appairez les termes avec leurs définitions (difficile)', passif: false, itna: 'Vocabulaire B2' },
      { type: 'pairing', appChal: 'chal', pairs: [['overtreffen', 'dépasser un niveau'], ['aanpassen', 'modifier pour être adapté'], ['voorkomen', 'empêcher']], fr: 'Appairez les verbes complexes', passif: false, itna: 'Verbes B2' },
      { type: 'pairing', appChal: 'chal', pairs: [['op korte termijn', 'dans le futur proche'], ['op lange termijn', 'dans un avenir lointain'], ['fossiele brandstof', 'source d\'énergie polluante']], fr: 'Appairez expressions et concepts', passif: true, itna: 'Expressions + Vocabulaire' },

      // ORDRE DE MOTS (20%)
      { type: 'wordorder', appChal: 'app', words: ['Het', 'klimaat', 'warmt', 'op', 'door', 'broeikasgassen'], correct: 'Het klimaat warmt op door broeikasgassen', fr: 'Le climat se réchauffe à cause des gaz à effet de serre', passif: false, itna: 'Syntaxe simple' },
      { type: 'wordorder', appChal: 'app', words: ['We', 'moeten', 'de', 'CO2-uitstoot', 'verminderen'], correct: 'We moeten de CO2-uitstoot verminderen', fr: 'Nous devons réduire les émissions de CO2', passif: false, itna: 'Verbes modaux' },
      { type: 'wordorder', appChal: 'app', words: ['De', 'droogte', 'zal', 'verergeren', 'als', 'we', 'niets', 'doen'], correct: 'De droogte zal verergeren als we niets doen', fr: 'La sécheresse s\'aggravera si nous ne faisons rien', passif: false, itna: 'Conditionnels' },
      { type: 'wordorder', appChal: 'chal', words: ['De', 'weerbaarheid', 'moet', 'worden', 'versterkt', 'tegen', 'extreem', 'weer'], correct: 'De weerbaarheid moet worden versterkt tegen extreem weer', fr: 'La résilience doit être renforcée contre les conditions météorologiques extrêmes', passif: true, itna: 'Passif complexe' },
      { type: 'wordorder', appChal: 'chal', words: ['Dringende', 'maatregelen', 'worden', 'genomen', 'door', 'de', 'regering'], correct: 'Dringende maatregelen worden genomen door de regering', fr: 'Des mesures urgentes sont prises par le gouvernement', passif: true, itna: 'Passif + Adjectifs' },
      { type: 'wordorder', appChal: 'chal', words: ['Als', 'we', 'de', 'transitie', 'niet', 'versnellen', 'zal', 'het', 'voor', 'laat', 'zijn'], correct: 'Als we de transitie niet versnellen zal het voor laat zijn', fr: 'Si nous n\'accélérons pas la transition, il sera trop tard', passif: false, itna: 'Syntaxe complexe' }
    ];

    let currentQ = 0;
    let responses = {};
    let pairingsState = {};

    function renderVocab() {
      const html = vocab.map(v => `
        <div style="background: white; border: 0.5px solid #ddd; border-radius: 8px; padding: 0.75rem; margin-bottom: 10px;">
          <div style="font-weight: 500; font-size: 13px; margin-bottom: 0.25rem;">${v.nl}</div>
          <div style="font-size: 11px; color: #666;">${v.fr}</div>
          <div style="font-size: 11px; color: #999; margin-top: 0.25rem; font-style: italic;">${v.def}</div>
        </div>
      `).join('');
      document.getElementById('vocabList').innerHTML = html;
    }

    function startTest() {
      document.getElementById('vocabScreen').classList.add('hidden');
      document.getElementById('testScreen').classList.remove('hidden');
      renderQuestion(0);
    }

    function renderQuestion(idx) {
      currentQ = idx;
      const q = questions[idx];
      document.getElementById('qNumber').textContent = idx + 1;
      document.getElementById('appChalTag').textContent = q.appChal === 'app' ? 'APPLICATION' : 'CHALLENGE';
      document.getElementById('typeTag').textContent = q.type.toUpperCase();
      document.getElementById('typeTag').className = 'type-tag ' + (q.appChal === 'chal' ? 'challenge' : '');
      document.getElementById('itnaTag').textContent = q.itna;
      document.getElementById('feedbackArea').innerHTML = '';
      document.getElementById('prevBtn').disabled = idx === 0;
      document.getElementById('nextBtn').textContent = idx === questions.length - 1 ? 'Naar lezing' : 'Volgende';

      let content = '';

      if (q.type === 'qcm') {
        content = `
          <div class="question-text">${q.q}</div>
          <div>${q.opts.map((opt, i) => `
            <div class="option">
              <input type="radio" name="answer" id="opt${i}" value="${opt}" onchange="showFeedback('${opt}')">
              <label for="opt${i}">${opt}</label>
            </div>
          `).join('')}</div>
        `;
      } else if (q.type === 'intrus') {
        content = `
          <div class="question-text">${q.q}</div>
          <div>${q.opts.map((opt, i) => `
            <div class="option">
              <input type="radio" name="answer" id="opt${i}" value="${opt}" onchange="showFeedback('${opt}')">
              <label for="opt${i}">${opt}</label>
            </div>
          `).join('')}</div>
        `;
      } else if (q.type === 'fill') {
        content = `
          <div class="question-text">${q.q}</div>
          <input type="text" id="fillInput" placeholder="${q.placeholder}" style="width: 100%; padding: 8px; border: 0.5px solid #ddd; border-radius: 6px; margin-bottom: 1rem;">
          <button class="button button-primary" onclick="checkFill('${q.ans}')">Vérifier</button>
        `;
      } else if (q.type === 'pairing') {
        pairingsState[idx] = { left: null, right: null, matches: [] };
        const shuffledRight = [...q.pairs].sort(() => Math.random() - 0.5);
        content = `
          <div class="question-text">${q.fr}</div>
          <div class="pair-container">
            <div class="pair-column">
              ${q.pairs.map((p, i) => `
                <div class="pair-item" onclick="selectPairLeft(${idx}, ${i})" id="left${i}">${p[0]}</div>
              `).join('')}
            </div>
            <div class="pair-column">
              ${shuffledRight.map((p, i) => `
                <div class="pair-item" onclick="selectPairRight(${idx}, '${p[1]}')" id="right${i}">${p[1]}</div>
              `).join('')}
            </div>
          </div>
          <button class="button button-primary" onclick="checkPairing(${idx})">Vérifier les appairages</button>
        `;
      } else if (q.type === 'wordorder') {
        const shuffled = [...q.words].sort(() => Math.random() - 0.5);
        content = `
          <div class="question-text">${q.fr}</div>
          <div class="word-order" id="wordDropZone" style="min-height: 40px; border: 2px dashed #ddd; padding: 10px; border-radius: 6px; margin-bottom: 1rem;"></div>
          <div class="word-order">${shuffled.map((w, i) => `
            <div class="word-box" draggable="true" id="word${i}" ondragstart="drag(event)" ondrop="drop(event)" ondragover="allowDrop(event)">${w}</div>
          `).join('')}</div>
          <button class="button button-primary" onclick="checkWordOrder('${q.correct}')">Vérifier</button>
        `;
      }

      document.getElementById('questionContent').innerHTML = content;
    }

    function showFeedback(answer) {
      const q = questions[currentQ];
      responses[currentQ] = answer;
      const isCorrect = answer === q.ans;
      const feedback = `
        <div class="result-area ${isCorrect ? 'correct' : 'incorrect'}">
          <div class="feedback-title">${isCorrect ? '✓ Correct!' : '✗ Faux'}</div>
          <div class="feedback-text"><strong>Réponse:</strong> ${q.ans}</div>
          <div class="feedback-text traduction"><strong>Traduction:</strong> ${q.fr}</div>
          <div class="feedback-text"><strong>Explications:</strong> ${q.itna}</div>
        </div>
      `;
      document.getElementById('feedbackArea').innerHTML = feedback;
    }

    function checkFill(ans) {
      const input = document.getElementById('fillInput').value.trim();
      responses[currentQ] = input;
      const isCorrect = input === ans;
      const q = questions[currentQ];
      const feedback = `
        <div class="result-area ${isCorrect ? 'correct' : 'incorrect'}">
          <div class="feedback-title">${isCorrect ? '✓ Correct!' : '✗ Faux'}</div>
          <div class="feedback-text"><strong>Réponse correcte:</strong> ${ans}</div>
          <div class="feedback-text traduction"><strong>Traduction:</strong> ${q.fr}</div>
          <div class="feedback-text"><strong>Explications:</strong> ${q.itna}</div>
        </div>
      `;
      document.getElementById('feedbackArea').innerHTML = feedback;
    }

    function checkPairing(idx) {
      responses[currentQ] = 'checked';
      const q = questions[currentQ];
      const feedback = `
        <div class="result-area correct">
          <div class="feedback-title">✓ Appairage vérifiés!</div>
          <div class="feedback-text traduction"><strong>Traductions:</strong> ${q.fr}</div>
        </div>
      `;
      document.getElementById('feedbackArea').innerHTML = feedback;
    }

    function checkWordOrder(correct) {
      const zone = document.getElementById('wordDropZone');
      const words = Array.from(zone.children).map(w => w.textContent).join(' ');
      responses[currentQ] = words;
      const isCorrect = words === correct;
      const q = questions[currentQ];
      const feedback = `
        <div class="result-area ${isCorrect ? 'correct' : 'incorrect'}">
          <div class="feedback-title">${isCorrect ? '✓ Correct!' : '✗ Faux'}</div>
          <div class="feedback-text"><strong>Votre réponse:</strong> ${words}</div>
          <div class="feedback-text"><strong>Réponse correcte:</strong> ${correct}</div>
          <div class="feedback-text traduction"><strong>Traduction:</strong> ${q.fr}</div>
        </div>
      `;
      document.getElementById('feedbackArea').innerHTML = feedback;
    }

    function allowDrop(e) { e.preventDefault(); }
    function drag(e) { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/html', e.target.innerHTML); }
    function drop(e) {
      e.preventDefault();
      const zone = document.getElementById('wordDropZone');
      const word = document.createElement('div');
      word.className = 'word-box placed';
      word.textContent = e.dataTransfer.getData('text/html').replace(/<[^>]*>/g, '');
      zone.appendChild(word);
      e.target.style.opacity = '0.5';
    }

    function nextQuestion() {
      if (currentQ < questions.length - 1) {
        renderQuestion(currentQ + 1);
      } else {
        document.getElementById('testScreen').classList.add('hidden');
        document.getElementById('readingScreen').classList.remove('hidden');
        showReading();
      }
    }

    function prevQuestion() {
      if (currentQ > 0) {
        renderQuestion(currentQ - 1);
      }
    }

    function showReading() {
      const reading = `
        <h3>Hittegolf en klimaatverandering in België</h3>
        <p>De afgelopen weken heeft België geleden onder extreme hitte. De gemiddelde temperatuur is met meer dan 3 graden gestegen sinds vorige week. Deze hittegolf, samen met de totale zonsverduistering van 12 augustus, roept vragen op over ons vermogen om met klimaatverandering om te gaan.</p>
        <p>Wetenschappers waarschuwen dat deze extreem hete periodes frequenter zullen worden. De Belgische regering stelt dat dringende maatregelen nodig zijn. Op korte termijn moet de publieke weerbaarheid worden versterkt door koelcentra in te stellen. Op lange termijn moet de energietransitie worden versneld.</p>
        <p>Echter, er bestaat spanning tussen de verschillende gewesten over hoe de transitie moet plaatsvinden. Vlaanderen en Wallonië zijn het niet eens over fossiele brandstoffen. Experts zeggen dat samenwerking essentieel is om de uitstoot te verminderen.</p>
        <p>De zonsverduistering herinnert ons aan onze plaats in het universum, maar ook aan de urgentie van handelen. Als we niets doen, zal het probleem alleen maar verergeren.</p>

        <div style="margin-top: 2rem; background: #f9f9f9; padding: 1rem; border-radius: 8px;">
          <h4 style="margin-bottom: 1rem;">Compréhension - Répondez aux questions:</h4>
          <div style="margin-bottom: 1rem;">
            <strong>1. Quelle est l'une des causes de la tension politique mentionnée?</strong>
            <div style="margin-top: 0.5rem;">
              <label><input type="radio" name="comp1"> Les différences sur la transition énergétique entre régions</label><br>
              <label><input type="radio" name="comp1"> L'éclipse solaire</label><br>
              <label><input type="radio" name="comp1"> Les koelcentra</label>
            </div>
          </div>
          <div style="margin-bottom: 1rem;">
            <strong>2. Que doivent faire les autorités à court terme?</strong>
            <div style="margin-top: 0.5rem;">
              <label><input type="radio" name="comp2"> Arrêter les fossiles immédiatement</label><br>
              <label><input type="radio" name="comp2"> Mettre en place des centres de refroidissement</label><br>
              <label><input type="radio" name="comp2"> Organiser une zonsverduistering</label>
            </div>
          </div>
          <div style="margin-bottom: 1rem;">
            <strong>3. Selon le texte, qu'arrivera-t-il si on ne fait rien?</strong>
            <div style="margin-top: 0.5rem;">
              <label><input type="radio" name="comp3"> Le problème améliorera</label><br>
              <label><input type="radio" name="comp3"> Le problème s'aggravera</label><br>
              <label><input type="radio" name="comp3"> La zonsverduistering arrêtera la chaleur</label>
            </div>
          </div>
        </div>
      `;
      document.getElementById('readingContent').innerHTML = reading;
    }

    function showResults() {
      let correct = 0;
      Object.keys(responses).forEach(k => {
        const idx = parseInt(k);
        if (responses[k] === questions[idx].ans || responses[k] === 'checked') {
          correct++;
        }
      });
      const percent = Math.round((correct / questions.length) * 100);

      document.getElementById('readingScreen').classList.add('hidden');
      document.getElementById('resultsScreen').classList.remove('hidden');
      document.getElementById('scoreDisplay').textContent = `${correct}/30 (${percent}%)`;

      const resultsBox = document.getElementById('resultsBox');
      resultsBox.className = 'results';
      if (percent >= 70) {
        resultsBox.classList.add('excellent');
        document.getElementById('scoreText').textContent = '✓ Uitstekend! Ga door naar Dag 2.';
      } else if (percent >= 56) {
        resultsBox.classList.add('good');
        document.getElementById('scoreText').textContent = '→ Goed. Herhaal Dag 1 vorige vragen.';
      } else {
        resultsBox.classList.add('weak');
        document.getElementById('scoreText').textContent = '✗ Meer oefening nodig. Herhaal alle vragen.';
      }
    }

    function restart() {
      responses = {};
      currentQ = 0;
      document.getElementById('resultsScreen').classList.add('hidden');
      document.getElementById('vocabScreen').classList.remove('hidden');
      renderVocab();
    }

    renderVocab();
  </script>
</body>
</html>
